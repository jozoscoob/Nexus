# Codex 검증 컨테이너의 데이터 접근 규칙 (SPEC §3.8 — 승인자 결정 2026-11-26)
#
# - 공개 데이터: 원본 사본 전체 열람 + 버려도 되는 스테이징 사본에 수정 시험(쓰기)
# - 라이선스·재배포 제한 데이터: 요약 통계만(행 수·열·결측률·중복·as-of 위반 수) — 파일 사본을 넘기지 않음
# - 실제 데이터(data/raw 등)는 Codex가 절대 고치지 않음. 제안 → 게이트 → 승인자 승인 → 작업자 적용
#
# 판정: 파일 경로 또는 parquet의 source_name 값에 아래 문자열이 하나라도 들어 있으면 '제한'(대소문자 무시).
# 판정이 애매하면 제한 쪽으로 둔다(거부 우선). 바꾸려면 이 파일만 고치면 된다.
restricted:
  # 승인자 지정 — 유료 라이선스
  - Databento
  - TradingEconomics
  - Trading Economics
  - te_commodities
  # 작업자 보수 판정(무료지만 이용약관상 재배포 금지) — 승인자가 풀 수 있음
  - yfinance
  - Investing.com

# 실행 범위(승인자 기본값 — 변경 가능): 매일은 오늘 바뀐 파일 중심, 토요일은 전체 점검
scope:
  changed_within_hours: 26
  full_sweep_weekday: 5        # 0=월 … 5=토

# 승인된 데이터 수정 적용 전 백업 보관 일수
snapshot_keep_days: 14

# 게이트 기준 — 스테이징 수정본이 이 범위를 벗어나면 '게이트 불통과'(승인 대상에서 제외)
gate:
  max_row_change_ratio: 0.05   # 행 수 변화 5% 이내
  max_value_scale_ratio: 10    # 수치 열 최소·최대가 원본 대비 10배 이상 벌어지면 불통과(단위 오류 차단)
