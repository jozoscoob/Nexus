# 조달 지표 사양 — G2 도착원가 참고 범위 · G3 3-시뮬레이션 매개변수 · 화면 배치 · 국문 표기
# 근거 문서: docs/research_desk/2026-11/g2_g3_procurement_metrics_panel_2026_11_20.md
# 규칙: A-191(과거 표본 서술만 — 확률 약속·구매/보류 권고 금지), D-021(외부 데이터 전용 — 보유 개월 등
#       실무 입력은 화면 세션 값으로만 쓰고 저장·백테스트·학습에 투입하지 않음).
# verified=false 세율은 확정 전까지 계산에 basic(5%)을 쓰고 화면에 '미확인'을 표기한다.

version: 1
as_of: "2026-11-20"
status: provisional   # 승인자 검토 전

tariff:
  base: CIF            # 과세가격 = CIF(보험 포함), 원화 환산은 관세청 주간 과세환율
  vat_pct: 10          # 수입 부가세 — 매입세액 공제 대상이라 원가에서 제외(자금 부담만)
  basic_pct: 5         # 기본세율(MFN 적용) — 미확인 세율의 대체값
  wto_bound_pct: 5.4
  trq: none            # 대두유 세번에는 TRQ 없음(식용 대두 1201.90·참기름 등과 구분)
  quota_tariff_history:
    - {period: "2022-06/2023-12", rate_pct: 0, lines: ["1507.10", "1507.90"],
       source: "USDA GAIN KS2024-0010 Vegetable Oil Market Overview p.9 (2024-01-01 환원)", verified: true}
    - {period: "2026", rate_pct: null, note: "2026 할당관세 운용방안 보도에서 대두유 미확인 — 부재 미입증",
       source: "nocutnews 2025-12 / taxtimes 2026 할당관세 기사", verified: false}
  sources:
    gain_2026: "data/raw/USDA/FAS/GAIN/Oilseeds/2026/03/26.03_South Korea_Oilseeds and Products Annual.pdf (p.25, 표21 p.29 — 출처 CLIP)"
    gain_2023: "data/raw/USDA/FAS/GAIN/Oilseeds/2023/03/23.03_South Korea_Oilseeds and Products Annual.pdf (p.29, 표31 p.32)"
    gain_2025: "data/raw/USDA/FAS/GAIN/Oilseeds/2025/03/25.03_South Korea_Oilseeds and Products Annual.pdf (p.22, 표18 p.25)"
    ks2024_0010: "data/raw/USDA/FAS/GAIN/Biofuels/2024/03/24.03_South Korea_Vegetable Oil Market Overview.pdf (p.3, p.9, p.10, 표7 p.11)"
  by_origin:            # 단위 % · 1507.10 = 조유(.1000 식용 / .2000 바이오디젤 / .9000 기타) · 1507.90 = 정제유(.10xx)
    US:
      agreement: KORUS
      "1507.10": {rate_pct: 0, verified: true, source: "ks2024_0010 p.10; gain_2026 표21 p.29"}
      "1507.90": {rate_pct: 0, verified: true, source: "ks2024_0010 p.10; gain_2026 표21 p.29"}
    EU:
