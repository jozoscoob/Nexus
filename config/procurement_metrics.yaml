  exceptions:
    "1507.90.9000": {rate_pct: 5, verified: false, note: "gain_2026 5% vs gain_2023 표31 2022·2023 열 8% — 상충, 물량 미미"}

landed_cost:
  formula: "L_krw_per_mt(h) = (F_h * 22.0462 + R_h_origin) * X_h * (1 + tariff_origin) + C_user"
  usc_lb_to_usd_mt: 22.0462
  layers:
    cbot:     {measured: "CBOT_BO_CLOSE 일별 정산가", assumed: "중심 무변화·EWMA×√h×정규 분위(B4a′)", distribution: b4a_prime, status: primary}
    residual: {measured: "관세청 1507.10 벌크(>=100 MT) 월별 CIF − CBOT 월평균(원산지별)",
               assumed: "리드타임 정렬 1~2개월 시차, 원산지 표본 <12개월이면 합산 표본",
               distribution: joint_paired_bootstrap,   # (h기간 CBOT 수익률, 같은 기간 잔차 변화) 쌍 재추출 — 독립 합성 금지
               min_origin_months: 12, status: reference}
    fx:       {measured: "FRED DEXKOUS 일별", assumed: "과세환율≈DEXKOUS, T+2", distribution: ewma_with_empirical_corr,
               ewma_lambda: 0.97, status: reference, fixed_fx_toggle: true}
    tariff:   {measured: "관세율표(tariff.by_origin)", assumed: "원산지증명 충족·할당관세 없음", distribution: deterministic, status: reference}
    excluded: [vat, port_inland, lc_cost, demurrage, refining_cost]
  evidence_2026_11_19:
    corr_dresidual_dcbot_monthly: -0.73
    corr_dcif_dcbot_lag1_1m_2m_3m: [0.19, 0.41, 0.55]
    fx_var_share_krw_cost_pct: 11.3

decision_params:
  cost_asymmetry: {c_u: 2, c_o: 1, tau_star: 0.667, sensitivity: [[1, 1], [3, 1]], user_adjustable: true,
                   note: "D6 잠정치 — 실무 확인 후 조정, 규칙만 사전 등록"}
  horizons_trading_days: [1, 5, 20, 60]
  wait_horizons_trading_days: [20, 40, 60]
  split_k_grid: [2, 3, 4]
  split_windows_trading_days: [40, 60]
  split_offsets_rule: "j * floor(W / k), j = 0..k-1 (균등 톤수)"
  regret_definition: "정책 원가 − 같은 60거래일 창의 사후 최저가 (일괄 대비 차이 병기, % 및 USD/MT)"
  tail_metric: {name: CVaR95, alpha: 0.95}
  backtest: {start: "2012-01-01", min_independent_blocks_per_cell: 3, block_trading_days: 60,
             same_contract_labels_required: true}   # R-046 — 정식 판정은 같은 계약 라벨 재계산 후
  lead_time: {calendar_days: [40, 50], trading_days_approx: [28, 36], route: "남미·미국 걸프 → 한국"}
  coverage_months: {source: user_session_input, persist: false}   # D-021

placement:
  G1: [term_structure_slope, residual_percentile]          # 상태 변수로도 등재
  G2: [price_position, volatility_regime, price_cvar95_empirical, residual_percentile, fx_layer, landed_cost_reference]
  G3: [budget_price_tau, regret_by_policy, regret_cvar95, coverage_vs_lead_time, origin_tariff_breakeven,
       term_structure_slope, policy_options_table]
  not_displayed: [position_in_reference_band]               # B4a′ 중심 = 현재가 → 항상 P50

