      "1507.10": {rate_pct: 0, verified: true, source: "ks2024_0010 p.10; gain_2026 p.25"}
      "1507.90": {rate_pct: 0, verified: true, source: "ks2024_0010 p.10; gain_2026 p.25"}
    ASEAN:
      agreement: Korea-ASEAN FTA (AKFTA)
      "1507.10": {rate_pct: 0, verified: true, source: "ks2024_0010 p.3, 표7 p.11"}
      "1507.90": {rate_pct: 5, verified: true, source: "ks2024_0010 p.3 (국내 정제 보호 — 단일 출처)"}
    VN:
