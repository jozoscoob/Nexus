  residual_percentile: "관세청 실측 도착가와 CBOT 환산의 차이(이력 백분위)"
  fx_layer: "원/달러 변동이 원화 원가에 더하는 폭"
  landed_cost_reference: "도착원가 참고 범위(원/톤, 관세 포함)"
  budget_price_tau: "비용 비중 반영 기준가"
