wording:
  banned: ["매수 적기", "추천", "상승 확률", "하락 확률", "기대 이익", "지금 사야", "사세요", "팔아야", "Buy", "Hold"]
  templates_ko:
    price_position: "오늘 정산가는 최근 1년 중 하위 {p1y}%, 최근 5년 중 {p5y}% 위치임(과거 분포 내 위치이며 방향을 뜻하지 않음)."
    budget_price_tau: "비용 비중(부족 {cu} : 과잉 {co})을 적용한 기준가임. 같은 방식의 과거 표본에서 {h_label} 뒤 가격이 이 값 이하였던 비율은 {hit}%였음."
    regret_by_policy: "2012년 이후 같은 구매 규칙을 매일 적용했을 때의 과거 결과이며, 향후 결과나 권고가 아님. 최종 판단은 담당자 승인 절차를 따름."
    price_cvar95_empirical: "과거 표본 기준, {h_label} 뒤 상승이 컸던 상위 5% 경우의 평균 상승폭은 현재 변동성 환산 약 {cvar}%임."
    residual_percentile: "최근 관세청 실측 도착가는 같은 달 CBOT 환산보다 톤당 약 {gap}달러 {dir}, 2010년 이후 {pct} 수준임(월별·지연 자료)."
    landed_cost_reference: "도착원가 줄은 관세청 실측 잔차·환율·관세를 반영한 참고 범위이며 적중률 검증 전임."
