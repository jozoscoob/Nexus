      "1507.90": {rate_pct: 0, verified: false, fallback_pct: 5,
                  source: "gain_2026 p.25가 정제유 0% 상대국에 베트남 명시 — AKFTA 5%와 상충, CLIP 확인 필요"}
    CN:
