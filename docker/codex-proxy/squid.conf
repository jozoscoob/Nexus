# Codex 검증 컨테이너 전용 나가는 연결 프록시(SPEC §3.8) — OpenAI·ChatGPT HTTPS만 허용, 그 밖은 전부 거부
http_port 3128
acl codex_dst dstdomain .openai.com .chatgpt.com
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT codex_dst
http_access deny all
cache deny all
access_log /var/log/squid/access.log
