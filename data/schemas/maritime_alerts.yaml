dataset: maritime_alerts
source_connector: src/pipeline/connectors/maritime_alerts_connector.py (UKMTO·JMIC·MARAD 경보 보도 — Google News RSS, NGA MSI API 시도)
output_path: data/raw/maritime_alerts_YYYYMMDD.parquet
description: "해역별 해사 보안 경보 보도 일별 건수(최근 14일) — PortWatch 주간 지연을 메우는 실시간 정성 신호. 건수는 보도 빈도이지 통항 차질 측정이 아님"
columns:
  - {name: price_date, dtype: "datetime64[ns]", nullable: false, description: "보도 게시일(UTC)"}
  - {name: indicator_code, dtype: object, nullable: false, description: "MARALERT_{HORMUZ|RED_SEA|BLACK_SEA|MALACCA|TAIWAN|WEST_AFRICA|OTHER}_COUNT, MARALERT_NGA_{NAVAREA}_ACTIVE"}
  - {name: value, dtype: float64, nullable: false, description: "경보 보도 건수 또는 유효 항행 경보 수"}
  - {name: unit, dtype: object, nullable: false, description: "reports/day | warnings"}
  - {name: note, dtype: object, nullable: true, description: "근거 — [기관] 제목 (매체) 원문 링크, 최대 5건(출처 추적)"}
  - {name: source_name, dtype: object, nullable: false, description: "MARITIME_ALERTS(GoogleNewsRSS·NGA)"}
  - {name: ingested_at, dtype: "datetime64[ns, UTC]", nullable: false, description: "수집 시각"}
  - {name: event_time, dtype: "datetime64[ns]", nullable: false, description: "보도 게시일"}
  - {name: period_end, dtype: "datetime64[ns]", nullable: true, description: "집계 기간 종료일(일별)"}
  - {name: release_time, dtype: "datetime64[ns]", nullable: true, description: "원천 공표 시점(미제공 — 규칙 추정)"}
  - {name: available_at, dtype: "datetime64[ns]", nullable: false, description: "게시일+1일(as-of 규칙 MARALERT_ — 장 마감 후 수집)"}
  - {name: source_vintage, dtype: object, nullable: true, description: "개정본 식별자(미보존 시 null)"}
