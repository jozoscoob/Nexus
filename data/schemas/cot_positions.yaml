dataset: cot_positions
source_connector: src/pipeline/connectors/cot_connector.py (CFTC Disaggregated Futures-Only, 시장 007601 — R-043)
output_path: data/raw/cot_positions_YYYYMMDD.parquet
description: "CBOT 대두유 주간 포지션 2010~ — 미결제약정·관리자금(MM)·생산자(PROD)·스왑(SWAP) 롱/숏/순"
columns:
  - {name: price_date, dtype: "datetime64[ns]", nullable: false, description: "포지션 기준일(화요일)"}
  - {name: indicator_code, dtype: object, nullable: false, description: "COT_SBO_{OI|MM|PROD|SWAP}_{LONG|SHORT|NET}, COT_SBO_MM_NET_PCT_OI"}
  - {name: value, dtype: float64, nullable: false, description: "계약 수 또는 % of OI"}
  - {name: unit, dtype: object, nullable: false, description: "contracts | % of OI"}
  - {name: source_name, dtype: object, nullable: false, description: "CFTC_COT_DISAGG"}
  - {name: ingested_at, dtype: "datetime64[ns, UTC]", nullable: false, description: "수집 시각"}
  - {name: event_time, dtype: "datetime64[ns]", nullable: false, description: "기준일"}
  - {name: period_end, dtype: "datetime64[ns]", nullable: true, description: "집계 기간 종료일(주간 포지션 — attach_asof 부여)"}
  - {name: release_time, dtype: "datetime64[ns]", nullable: true, description: "원천 공표 시점(CFTC 금요일 공표 — 미제공 시 규칙 추정)"}
  - {name: available_at, dtype: "datetime64[ns]", nullable: false, description: "기준일+7일(as-of 규칙 COT_)"}
  - {name: source_vintage, dtype: object, nullable: true, description: "개정본 식별자(미보존 시 null — vintage_known 참조)"}
