  # ── 파이프라인 완료 요약 + PDF 품질 보고서 (WBS 1.1.8) ──────────────────────
  pipeline-summary:
    name: "Pipeline Summary & Data Quality Report (PDF)"
    runs-on: ubuntu-latest
    needs: [economic-indicators, shipping-indices, wasde-crop-data, climate-enso, geopolitical-risk, production-data, commodity-prices, customs-import-stats, geointel, session-close-target]
    if: always()   # 일부 커넥터 실패 시에도 요약 실행
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (PDF 포함)
        run: |
          sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0
          pip install pandas pyarrow weasyprint
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
          merge-multiple: true
      - name: Generate GitHub Step Summary
        run: |
          python - <<'PYEOF'
          import os, glob, pandas as pd
          from pathlib import Path
          files = glob.glob("data/raw/**/*.parquet", recursive=True)
          summary = []
          for f in sorted(files):
              try:
                  df = pd.read_parquet(f)
                  null_pct = round(df.isnull().mean().mean() * 100, 1)
                  flag = " ⚠️" if null_pct > 5 else ""
                  summary.append(f"| {Path(f).name} | {len(df)} | {df['ingested_at'].max()} | {null_pct}%{flag} | ✅ |")
              except Exception as e:
                  summary.append(f"| {Path(f).name} | – | – | – | ❌ {e} |")
          md = [
              "## External Data Pipeline — Run Summary",
              f"**Run ID**: {os.environ.get('GITHUB_RUN_ID', 'local')}",
              "",
              "| File | Rows | Ingested At (UTC) | Null% | Status |",
              "|---|---|---|---|---|",
          ] + summary
          print("\n".join(md))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(md))
          PYEOF
      - name: Generate PDF & HTML quality report
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python src/pipeline/report_generator.py
      - name: Export parquet → Excel (다운로드용)
        run: pip install openpyxl && python src/pipeline/export_data.py
      - name: Upload reports (PDF + HTML + Excel)
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-quality-report-${{ github.run_id }}
          path: |
            reports/pipeline/pipeline_report_*.pdf
            reports/pipeline/pipeline_report_*.html
            data/exports/*.xlsx
          retention-days: 30
          if-no-files-found: warn

  # ── WBS 1.1.8: C-08 DQSOps 데이터 품질 검증 (C-06 EDA 전 1차 게이트) ──────────
  # C-08 Data Quality Validator (Haiku 4.5 STRUCTURED_EXTRACT)
  # DQSOps 5차원: 정확도(0.3)·완전성(0.25)·일관성(0.20)·신선도(0.15)·왜도(0.10)
  # 🟢 PASS(≥0.70) → C-06 진행 | 🟡 WARNING(0.50~0.69) → 경고 후 진행 | 🔴 REJECTED(<0.50) → 파이프라인 차단
  c08-dq-validation:
    name: "C-08 | DQSOps Data Quality Validation Gate"
    runs-on: ubuntu-latest
    needs: [pipeline-summary]
    if: always()
    outputs:
      overall_status: ${{ steps.dq.outputs.overall_status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas pyarrow numpy
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
          merge-multiple: true
      - name: Run C-08 DQSOps validation
        id: dq
        env:
          # A-119: 이 파이프라인은 **API 커넥터만** 실행한다. 수동 업로드 파서 산출물
          #   (wasde_historical·psd_historical·gats_*·te_commodities_*)은 Historical
          #   파이프라인 소관이므로 여기서 없는 게 정상 — 필수 목록에서 제외한다.
          #   특정 커넥터만 선택 실행한 경우엔 그 하나만 요구한다(오탐 방지).
          # ⚠️ GH 표현식은 &&가 ||보다 우선한다 — 괄호가 없으면 boolean true가 들어간다.
          DQ_EXPECTED: >-
            ${{ (github.event.inputs.connector == 'all' || github.event.inputs.connector == '')
            && 'economic_indicators,shipping_indices,crop_data?,climate_data,geopolitical_indices,production_data,commodity_data'
            || github.event.inputs.connector }}
          # A-246: crop_data는 '?'(선택) — USDA FAS 장애(런 #93)가 G1 발행을 막지 않게. G1의 작황·
          #   수급 입력은 수동 WASDE·PSD parquet(Readiness 잡이 재구성)이 담당하며 crop_data는
          #   feature_contract에 피처 0건. 잡 실패 자체는 여전히 red로 표면화된다(A-182 유지).
        run: python src/pipeline/validators/c08_dq_validator.py
      - name: Upload C-08 DQ report
        uses: actions/upload-artifact@v4
        with:
          name: c08-dq-report-${{ github.run_id }}
          path: reports/data_quality/dq_report_*.json
          retention-days: 30
          if-no-files-found: warn

  # ── WBS 1.1.8: C-06 EDA 검증 (C-08 DQ 통과 후 2차 게이트) ──────────────────────
  # C-06 EDA Expert: 수집된 parquet의 구조적 무결성·이상치·결측치 자동 검증
  # 출력: reports/pipeline/c06_eda_report_{DATE}.json (C-03에 전달)
  # C-03은 이 단계 통과 후에만 G1 분석 실행
  c06-eda-validation:
    name: "C-06 | EDA Validation — Data Integrity Gate"
    runs-on: ubuntu-latest
    needs: [c08-dq-validation]
    # A-168/A-169: 암묵 success() 차단(전이 실패 허용) + 수동 취소는 존중(!cancelled())
    if: >-
      !cancelled() &&
      needs.c08-dq-validation.result == 'success' &&
      (needs.c08-dq-validation.outputs.overall_status == 'PASS' ||
       needs.c08-dq-validation.outputs.overall_status == 'WARNING')
    outputs:
      eda_status: ${{ steps.eda.outputs.eda_status }}
      stale_connectors: ${{ steps.eda.outputs.stale_connectors }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas pyarrow numpy scipy
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
          merge-multiple: true
      - name: Run C-06 EDA validation
        id: eda
        run: |
          python - <<'PYEOF'
          import os, glob, json
          from pathlib import Path
          from datetime import date, timedelta
          import numpy as np
          import pandas as pd

          OUTPUT_DIR = "reports/pipeline"
          os.makedirs(OUTPUT_DIR, exist_ok=True)
          today = date.today()
          stale_threshold = 5  # 영업일

          results = {}
          stale = []
          for f in sorted(glob.glob("data/raw/**/*.parquet", recursive=True)
                          + glob.glob("data/raw/*.parquet")):
              name = Path(f).stem
              try:
                  df = pd.read_parquet(f)
              except Exception as e:
                  results[name] = {"status": "READ_ERROR", "error": str(e)}
                  continue
              # 결측치 프로파일
              null_pct = float(df.isnull().mean().mean() * 100)
              # 신선도
              freshness = "OK"
              if "ingested_at" in df.columns:
                  max_ts = pd.to_datetime(df["ingested_at"], utc=True, errors="coerce").max()
                  if pd.notna(max_ts):
                      biz_days = np.busday_count(max_ts.date(), today)
                      if biz_days > stale_threshold:
                          freshness = f"STALE_{biz_days}d"
                          stale.append(name)
              # 이상치 Z-score (수치 컬럼)
              num_cols = df.select_dtypes(include="number").columns.tolist()
              outlier_flags = {}
              for col in num_cols[:10]:
                  vals = pd.to_numeric(df[col], errors="coerce").dropna()
                  if len(vals) > 5:
                      z = (vals - vals.mean()) / vals.std()
                      outlier_count = int((z.abs() > 3).sum())
                      if outlier_count:
                          outlier_flags[col] = outlier_count
              results[name] = {
                  "status": "STALE" if "STALE" in freshness else ("WARN" if null_pct > 5 else "OK"),
                  "rows": len(df), "null_pct": round(null_pct, 1),
                  "freshness": freshness,
                  "outlier_cols": outlier_flags,
              }
              if null_pct > 5:
                  print(f"[C-06 경고] {name}: 결측치 {null_pct:.1f}% — 5% 초과")
              if outlier_flags:
                  print(f"[C-06 경고] {name}: Z>3 이상치 컬럼: {outlier_flags}")
              if "STALE" in freshness:
                  print(f"[C-06 경고] {name}: {freshness}")

          report = {"run_date": today.isoformat(), "connectors": results,
                    "stale": stale, "overall": "PASS" if not stale else "WARN"}
          out = f"{OUTPUT_DIR}/c06_eda_report_{today.strftime('%Y%m%d')}.json"
          with open(out, "w") as fh:
              json.dump(report, fh, ensure_ascii=False, indent=2)
          print(f"[C-06 완료] EDA 검증 보고서 → {out}")
          print(f"[C-06] STALE 커넥터: {stale or '없음'}")

          gh_output = os.environ.get("GITHUB_OUTPUT", "")
          if gh_output:
              with open(gh_output, "a") as fh:
                  fh.write(f"eda_status={'WARN' if stale else 'PASS'}\n")
                  fh.write(f"stale_connectors={','.join(stale) or 'none'}\n")
          PYEOF
      - name: Upload C-06 EDA report
        uses: actions/upload-artifact@v4
        with:
          name: c06-eda-report-${{ github.run_id }}
          path: reports/pipeline/c06_eda_report_*.json
          retention-days: 30
          if-no-files-found: warn

  # ── 모델 진입 준비도 게이트: 목표가격 계약·핵심피처·as-of ───────────────────
  model-readiness:
    name: "Model Readiness | Target Contract & Core Features"
    runs-on: ubuntu-latest
    needs: [c06-eda-validation]
    if: >-
      !cancelled() &&
      (github.event.inputs.connector == 'all' || github.event_name == 'schedule') &&
      needs.c06-eda-validation.result == 'success' &&
      needs.c06-eda-validation.outputs.eda_status == 'PASS'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas pyarrow duckdb pyyaml openpyxl xlrd
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
          merge-multiple: true
      - name: Rebuild manual-upload parquets (A-183 — 일별 커버리지 정합)
        # 일별 런에는 Historical 전용 수동 파서 산출물(TE 9개년 BDI·CPO 등)이 없어
        # Readiness 커버리지가 실시간분만으로 산정(BDI·CPO 56%<85% — 런 32184410301
        # 실증). 커밋된 원본 xlsx에서 결정적 파서 6종을 재실행해 실보유분으로 산정.
        run: |
          python scripts/ingest_te_xlsx.py
          python scripts/ingest_wasde_xlsx.py
          python scripts/ingest_psd_data.py
          python scripts/ingest_gats_data.py
          python scripts/ingest_ice_volumes.py
          python scripts/ingest_nasa_power_xlsx.py
          python scripts/ingest_customs_gw_uploads.py   # A-247: 관세청 GW 업로드본 172파일 → 롱포맷(일별 편입)
          python scripts/ingest_fx_brl_usd_xlsx.py       # A-266: BRL/USD 15개년 업로드(준비도 ⑤)
          python scripts/ingest_enso_oni_xlsx.py         # A-266: ENSO ONI 1950~ 업로드(준비도 ⑥)
          python -m src.features.structural_indicators || echo "::warning::구조 지표 산출 실패(비치명)"   # A-291: 시장·유통 구조 지표(파생) — mart·변인 순위 편입
      - name: Run model readiness gate
        run: python scripts/data_readiness.py
      - name: Build and independently verify feature mart
        # A-171: 'python src/...' 직접 실행은 repo 루트가 sys.path에 없어
        #   `from src.pipeline.asof import ...`가 ModuleNotFoundError(9차 런 실증) — -m 실행
        run: |
          python -m src.features.build_feature_mart --self-test
          python -m src.features.build_feature_mart
      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-readiness-${{ github.run_id }}
          path: |
            reports/market/data_readiness_*.md
            reports/market/feature_mart_*.md
            data/gold/feature_mart.parquet
            data/gold/feature_contract.yaml
            data/raw/te_commodities_historical.parquet   # A-258: TE 수동본(BDI 9개년)을 G1 잡에 전달 — 없으면 API BDI(2017~) 폴백
            # A-267(2026-09-14): 수동 파케이 전 종을 G1 잡에 전달 — 브리프 '데이터 적시성 11/23'의 실체는
            #   미전달 10종이 '❌ 데이터 없음'으로 집계된 것(신선도 문제 아님)
            data/raw/wasde_historical.parquet
            data/raw/psd_historical.parquet
            data/raw/gats_quantity_historical.parquet
            data/raw/gats_value_historical.parquet
            data/raw/ice_monthly_volumes*.parquet
            data/raw/nasa_power_agroclimatology_historical.parquet
            data/raw/customs_gw_uploads_historical.parquet
            data/raw/fx_brl_usd_historical.parquet
            data/raw/enso_oni_historical.parquet
          retention-days: 30
          if-no-files-found: error

  # ── WBS 1.1.8+: C-03 G1 변수 중요도 분석 ───────────────────────────────────
  # C-03 Lead Data Scientist (Claude Opus 4.7 Thinking Mode) — Phase A 기초 분석
  # 입력: c06-eda-validation 통과 후 data/raw/*.parquet (최근 7일)
  # 출력: reports/pipeline/g1_variable_importance_{DATE}_{ko|en}.html
  # Phase B: XGBoost+SHAP + Granger 인과검정 + TCN-XGBoost 추가 예정 (30일+ 누적 후)
  g1-analysis:
    name: "C-03 | G1 Variable Importance Analysis (P1-01~04 통합)"
    runs-on: ubuntu-latest
    # A-227: c08 output을 일별 브리프 E1 스트립에 주입(체인상 선행 잡이라 대기 비용 없음)
    # A-274: 다이제스트 잡을 선행시켜 같은 런의 당일 기사가 브리프에 실리게 함(종전엔 한 회차 뒤)
    needs: [model-readiness, c08-dq-validation, daily-unstructured-digest]
    if: "!cancelled() && needs.model-readiness.result == 'success'"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0 2>/dev/null || true
          pip install pandas pyarrow pyyaml scikit-learn statsmodels numpy weasyprint markdown2 openpyxl xlrd   # openpyxl: 관세청 GW xlsx → 도착가 범위(A-272)
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
          merge-multiple: true
      - name: Rebuild manual-upload parquets for the brief (A-284 — 날짜 기준 편차·스냅샷 원시 계열)
        # 브리프의 변동일 편차·유사 시기 '현재 편차'·주요 지표 표는 원시 수집 계열(TE 에너지·팜유, ICE, 관세청 GW,
        # BRL/USD, ENSO)을 직접 읽는다. 런 #114 브리프에서 팜유(MYR)·에너지 계열이 '미수집'으로 표시돼(아티팩트 착지 경로
        # 의존) 이 잡에서 결정적 파서를 직접 재실행해 원시 계열을 보장한다(I-001). 뒤의 복원 스텝과 내용은 동일.
        run: |
          for s in ingest_te_xlsx ingest_wasde_xlsx ingest_psd_data ingest_gats_data ingest_ice_volumes \
                   ingest_nasa_power_xlsx ingest_customs_gw_uploads ingest_fx_brl_usd_xlsx ingest_enso_oni_xlsx; do
            python "scripts/$s.py" > "/tmp/$s.log" 2>&1 && echo "재구성: $s" || { echo "::warning::$s 실패(비치명) — $(tail -n 2 /tmp/$s.log)"; }
          done
          python -m src.features.structural_indicators || echo "::warning::구조 지표 산출 실패(비치명) — 브리프 구조 지표 표 생략"   # A-291
      - name: Restore feature mart to data/gold (A-178 — merge 다운로드 착지 보정)
        # Readiness 잡이 만든 mart(gold)는 아티팩트 내부 경로가 data/gold/*라서
        # merge 다운로드 시 data/raw/data/gold/에 착지 — G1 로더 기대 경로로 복원.
        # (15차 런 실증: 모든 게이트 통과 후 mart 미발견으로만 실패)
        run: |
          mkdir -p data/gold
          for f in feature_mart.parquet feature_contract.yaml; do
            src=$(find data/raw -name "$f" -type f | head -n 1)
            if [ -n "$src" ]; then mv "$src" "data/gold/$f"; echo "복원: $f ($src)"; fi
          done
          test -f data/gold/feature_mart.parquet || { echo "::error::feature mart 미착지 — readiness 아티팩트 확인"; exit 1; }
          # A-274: 같은 런의 다이제스트 아카이브(당일 기사) 복원 — 체크아웃 커밋에는 이번 런 append가 없다
          csv_src=$(find data/raw -name "unstructured_daily_signals.csv" -type f | head -n 1)
          if [ -n "$csv_src" ]; then
            new_n=$(wc -l < "$csv_src"); old_n=$(wc -l < data/processed/unstructured_daily_signals.csv 2>/dev/null || echo 0)
            if [ "$new_n" -ge "$old_n" ]; then
              cp "$csv_src" data/processed/unstructured_daily_signals.csv
              echo "복원: 일별 신호 아카이브 ${old_n}→${new_n}행 ($csv_src)"
            fi
          fi
          # A-258: Readiness 잡이 재구성한 TE 수동본(BDI 9개년)도 merge 다운로드 시
          # data/raw/data/raw/에 착지 — G1 로더 기대 경로(data/raw/)로 복원.
          # 미착지면 variable_importance_g1._series_from_frames가 API BDI(2017~)로 폴백하므로 경고만.
          te_src=$(find data/raw -name "te_commodities_historical.parquet" -type f -not -path "data/raw/te_commodities_historical.parquet" | head -n 1)
          if [ -n "$te_src" ]; then
            mv "$te_src" "data/raw/te_commodities_historical.parquet"
            echo "복원: te_commodities_historical.parquet ($te_src)"
          fi
          # A-267: Readiness가 재구성한 수동 파케이 전 종 복원(merge 다운로드로 data/raw/data/raw/에 착지)
          for f in wasde_historical psd_historical gats_quantity_historical gats_value_historical \
                   nasa_power_agroclimatology_historical customs_gw_uploads_historical \
                   fx_brl_usd_historical enso_oni_historical; do
            src=$(find data/raw -name "$f.parquet" -type f -not -path "data/raw/$f.parquet" | head -n 1)
            if [ -n "$src" ]; then mv "$src" "data/raw/$f.parquet"; echo "복원: $f.parquet"; fi
          done
          for src in $(find data/raw -mindepth 2 -name "ice_monthly_volumes*.parquet" -type f); do
            mv "$src" "data/raw/$(basename "$src")"; echo "복원: $(basename "$src")"
          done
          if [ ! -f data/raw/te_commodities_historical.parquet ]; then
            echo "::warning::TE 수동본 parquet 미착지 — G1 BDI 경보는 API 계열 폴백(A-258)"
          fi
      - name: as-of 시점 정합성 게이트 (D-023) — 위반 시 모델 진입 차단
        # available_at 없는 피처는 CLAUDE.md §1에 따라 모델 투입 금지.
        # 이행기에는 ASOF_EXEMPT로 미적용 산출물을 면제할 수 있다(적용 완료 시 제거).
        env:
          ASOF_EXEMPT: ${{ vars.ASOF_EXEMPT }}
        run: python scripts/validate_asof.py

      - name: Rebuild unstructured signal time series (통합 분석 입력 — Session 44)
        # 커밋된 비정형 인덱스 CSV에서 UNSTR_* parquet 재생성 → 정형+비정형 통합 분석
        run: python scripts/build_unstructured_timeseries.py
      - name: Determine G1 publish mode (3계층 발행 — 2026-08-14 조정자 승인)
        # 스케줄 실행에만 적용: 평일=alert(경보 시에만 발행) · 금요일 KST=weekly ·
        # WASDE 발표 후 첫 실행(36시간 창)=monthly. 수동/디스패치 실행은 full 유지.
        id: pubmode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "[정보] 비스케줄 실행 — full 모드"
            exit 0
          fi
          python - <<'PYEOF'
          import glob, os
          from datetime import datetime, timedelta, timezone
          import pandas as pd

          now_utc = datetime.now(timezone.utc)
          kst = now_utc + timedelta(hours=9)
          mode = "weekly" if kst.weekday() == 4 else "alert"   # 금요일(KST) 정규판

          # WASDE 발표 감지 — 정확히-1회 판정 (GPT 교차검증 정정 2026-08-14):
          # 고정 시간창(36h)은 발표 당일 20:30 UTC 실행과 익일 실행이 모두 창에 들어
          # monthly 이중 발행 가능, 금요일 발표는 월요일 실행에서 누락 가능.
          # → "직전 스케줄 실행 시각 이후에 available_at이 새로 생겼는가"로 판정.
          #   직전 실행 = 가장 최근의 19:17 UTC(일~목, cron과 동일 — A-263 이동 반영) — 주말·공휴일을
          #   건너뛰어도 창이 이어지므로 금요일 발표도 일요일 실행에서 1회 잡힘.
          def prev_scheduled_run(ref: datetime) -> datetime:
              cand = ref.replace(hour=19, minute=17, second=0, microsecond=0)   # cron 17 19(A-263)와 동기(A-271)
              if cand >= ref:
                  cand -= timedelta(days=1)
              while cand.weekday() not in {6, 0, 1, 2, 3}:   # 일~목(UTC)만 cron 발화
                  cand -= timedelta(days=1)
              return cand

          try:
              latest = None
              for p in sorted(glob.glob("data/raw/wasde*.parquet")):
                  df = pd.read_parquet(p, columns=["available_at"])
                  m = pd.to_datetime(df["available_at"], errors="coerce", utc=True).max()
                  if pd.notna(m) and (latest is None or m > latest):
                      latest = m
              if latest is not None:
                  latest_dt = latest.to_pydatetime()
                  prev_run = prev_scheduled_run(now_utc)
                  # 미래 타임스탬프는 발표로 인정하지 않음 (look-ahead 차단)
                  if prev_run < latest_dt <= now_utc:
                      mode = "monthly"
                      print(f"[정보] WASDE 발표 감지 (available_at={latest}, "
                            f"직전 실행 {prev_run:%m-%d %H:%M} 이후) — 월별 심층판")
                  elif latest_dt > now_utc:
                      print(f"[경고] WASDE available_at이 미래값({latest}) — 발표로 인정 안 함")
          except Exception as e:
              print(f"[경고] WASDE 발표 감지 실패 — 요일 기반 모드 유지: {e}")

          print(f"[정보] G1 발행 모드: {mode} (KST {kst:%Y-%m-%d %a})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"mode={mode}\n")
          PYEOF
      - name: Run G1 reliability metrics (A-264 — 2단계 검증 지표)
        # alert 모드는 실시간 R1~R6만(경량, 과거 H1~H5는 직전 정규판 값을 이월), weekly/monthly/full은 H1~H5 재산출. 비치명.
        # A-271: 브리프 생성 **앞**에서 산출하고 data/processed에도 착지 — 브리프 신뢰도 블록이 이번 회차 값을 읽게 함
        continue-on-error: true
        env:
          G1_PUBLISH_MODE: ${{ steps.pubmode.outputs.mode }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          rd="reports/pipeline/run_${{ github.run_id }}"; mkdir -p "$rd"
          set +e
          python -m src.evaluation.g1_reliability \
            --mode "${{ steps.pubmode.outputs.mode }}" \
            --report-dir "$rd" \
            --json "$rd/g1_reliability_latest.json" 2>&1 | tee "$rd/g1_reliability_log.txt"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # A-274: 종전엔 실패가 로그 절단 속에 묻혀 금요일 정규판 갱신 실패를 알 수 없었다
            { echo "## ⚠️ 신뢰도 지표 산출 실패(비치명) — 마지막 25줄"; echo '```'; tail -n 25 "$rd/g1_reliability_log.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          cp "$rd/g1_reliability_latest.json" data/processed/g1_reliability_latest.json
      - name: Run C-03 G1 variable importance analysis
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          G1_PUBLISH_MODE: ${{ steps.pubmode.outputs.mode }}
          E1_GATE_STATUS: ${{ needs.c08-dq-validation.outputs.overall_status }}
          # 실행별 격리 디렉터리 — 과거 산출물 재발행 차단 (GPT 교차검증 정정)
          G1_REPORT_DIR: reports/pipeline/run_${{ github.run_id }}
        run: python src/forecasting/variable_importance_g1.py 7
      - name: Append G1 summary to GitHub Step Summary
        run: |
          python - <<'PYEOF'
          import os, glob
          from pathlib import Path
          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          mode = "${{ steps.pubmode.outputs.mode }}"
          rdir = "reports/pipeline/run_${{ github.run_id }}"   # 이번 실행 산출물만
          alerts = sorted(glob.glob(f"{rdir}/g1_alert_*.md"))
          reports = sorted(glob.glob(f"{rdir}/g1_variable_importance_*_ko.html"))
          if mode == "alert":
              if alerts:
                  summary.write(f"\n\n## 🚨 C-03 G1 일별 경보판 발행\n")
                  summary.write(Path(alerts[-1]).read_text(encoding="utf-8"))
              else:
                  # "이상 없음"이 아니라 임계값 기준의 사실만 기술 (GPT 교차검증 정정)
                  summary.write("\n\n## C-03 G1 일별 점검 — 구조적 단절 임계값 초과 없음"
                                " (경보판 미발행)\n")
          elif reports:
              label = {"weekly": "주별 정규판", "monthly": "월별 심층판"}.get(mode, "전체 보고서")
              summary.write(f"\n\n## C-03 G1 분석 완료 ({label})\n리포트: `{Path(reports[-1]).name}`\n")
              # A-179: TOP 10 표 포함 ko.md 전문을 Step Summary에 노출 — 조정자 즉시 열람
              mds = sorted(glob.glob(f"{rdir}/g1_variable_importance_*_ko.md"))
              if mds:
                  summary.write("\n" + Path(mds[-1]).read_text(encoding="utf-8"))
          summary.close()
          PYEOF
      - name: Upload G1 analysis reports (HTML + PDF + Markdown)
        # alert 모드에서 무경보면 산출물이 없는 것이 정상 — ignore.
        # monthly(심층판)는 90일 보관: D-026(신규 git push 저장소 금지)에 따라 repo 커밋
        # 대신 아티팩트 장기 보관, 영구 아카이브는 Azure Blob 이관(D-028) 후 일원화.
        uses: actions/upload-artifact@v4
        with:
          name: g1-variable-importance-${{ github.run_id }}
          path: |
            reports/pipeline/run_${{ github.run_id }}/g1_daily_brief_*.html
            reports/pipeline/run_${{ github.run_id }}/g1_variable_importance_*.html
            reports/pipeline/run_${{ github.run_id }}/g1_variable_importance_*.pdf
            reports/pipeline/run_${{ github.run_id }}/g1_variable_importance_*.md
            reports/pipeline/run_${{ github.run_id }}/g1_alert_*.md
            reports/pipeline/run_${{ github.run_id }}/g1_alert_ledger.csv
            reports/pipeline/run_${{ github.run_id }}/g1_reliability_*
          retention-days: ${{ steps.pubmode.outputs.mode == 'monthly' && 90 || 30 }}
          if-no-files-found: ${{ steps.pubmode.outputs.mode == 'alert' && 'ignore' || 'error' }}

  # ── E1: 서명된 무소식 (차별화 6선 1순위 · D-048 · A-202) ─────────────────────
  # '침묵'과 '검사된 무소식'을 구분한다 — fail-open 3회(A-160·A-168·A-169) 교훈.
  # 게이트 상태·경보 수·준비도·교차검증 원장을 모아 일별 서명 스탬프를 발행하고
  # data/processed/signed_daily_stamps.csv에 영구 축적(A-181 커밋 패턴).
  signed-daily-stamp:
    name: "E1 | 서명된 무소식 — 일별 검사 스탬프"
    runs-on: ubuntu-latest
    needs: [c08-dq-validation, model-readiness, g1-analysis]
    # 체인 어디서 멈췄든 스탬프는 남긴다(그게 E1의 존재 이유) — 취소만 존중
    if: "!cancelled() && (github.event_name == 'schedule' || github.event.inputs.connector == 'all')"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            data/processed
            docs/research_desk
            reports/pipeline
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas
      - name: Restore readiness report
        # model-readiness 잡이 skip/실패면 아티팩트가 없다 — 스크립트가 '미확인'으로 정직 표기
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: model-readiness-${{ github.run_id }}
          path: .
      - name: Restore G1 alert files
        # alert 모드 무경보면 아티팩트 자체가 없다(if-no-files-found: ignore) — 경보 0건으로 판정
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: g1-variable-importance-${{ github.run_id }}
          path: reports/pipeline/run_${{ github.run_id }}
      - name: Stage latest daily brief (배포 브리지 — 세션·아티팩트 재발행 경로, DQ-23)
        # 브리프는 아티팩트로만 존재해 세션(아티팩트 호스트 차단)이 받을 수 없었음 → 최신 1파일만 덮어쓰기.
        # D-026 예외: 이력 누적이 아닌 배포 브리지(단일 파일 덮어쓰기)이며 S3 정적 사이트 이관 시 소멸.
        run: |
          mkdir -p reports/pipeline/latest
          f=$(ls -t reports/pipeline/run_${{ github.run_id }}/g1_daily_brief_*.html 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            cp "$f" reports/pipeline/latest/g1_daily_brief_latest.html
            date -u +%FT%TZ > reports/pipeline/latest/g1_daily_brief_asof.txt   # A-271: latest 갱신 시각 마커
            echo "일별 브리프 착지: $f → reports/pipeline/latest/g1_daily_brief_latest.html"
          else
            echo "[경고] 이번 회차 브리프 없음(미발행) — latest는 직전 회차 파일 그대로(g1_daily_brief_asof.txt 참조)"
          fi
          a=$(ls -t reports/pipeline/run_${{ github.run_id }}/g1_alert_*.md 2>/dev/null | head -1)
          if [ -n "$a" ]; then cp "$a" reports/pipeline/latest/g1_alert_latest.md; fi
          # A-264: 경보 원장·신뢰도 지표 JSON을 저장소 경로로 승격(브리프 신뢰도 블록 입력)
          r="reports/pipeline/run_${{ github.run_id }}"
          [ -f "$r/g1_alert_ledger.csv" ] && cp "$r/g1_alert_ledger.csv" data/processed/g1_alert_ledger.csv && echo "경보 원장 착지"
          [ -f "$r/g1_reliability_latest.json" ] && cp "$r/g1_reliability_latest.json" data/processed/g1_reliability_latest.json && echo "신뢰도 지표 착지"
          true
      - name: Build signed daily stamp
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          # C-08 게이트 판정은 잡 output으로 직접 전달(파일은 잡 간 미공유)
          E1_GATE_STATUS: ${{ needs.c08-dq-validation.outputs.overall_status }}
        run: python scripts/signed_daily_stamp.py
      - name: Commit stamp archive + latest brief (A-181 패턴)
        env:
          # A-279: 충돌 재해결 시 스탬프를 재생성하므로 빌드 스텝과 동일 입력이 필요
          GITHUB_RUN_ID: ${{ github.run_id }}
          E1_GATE_STATUS: ${{ needs.c08-dq-validation.outputs.overall_status }}
        run: |
          git config user.name "nexus-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed/signed_daily_stamps.csv data/processed/g1_alert_ledger.csv data/processed/g1_reliability_latest.json reports/pipeline/latest 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "스탬프·브리프 무변경 — 커밋 생략"
            exit 0
          fi
          git commit -m "data: E1 서명된 무소식 스탬프 + 일별 브리프 배포 브리지 ($(date -u +%F)) [A-202]" || exit 0
          # A-271: bot push 경합(교차검증·다른 bot 커밋) 3회 재시도 — 실패는 잡 실패로 가시화
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            # A-279: 같은 날 2회 런(런 #111→#112)이면 스탬프 CSV 마지막 행을 양쪽이 갱신해 텍스트 충돌
            #        → 상류본(ours=origin/main) 위에 스탬프를 재생성(같은 날짜 행은 스크립트가 최신으로 대체)해
            #        해소한 뒤 rebase 계속. 브리프·기록부는 이번 회차 산출물이 덮어쓰는 것이 설계 의도.
            if git diff --name-only --diff-filter=U | grep -qx data/processed/signed_daily_stamps.csv; then
              git checkout --ours -- data/processed/signed_daily_stamps.csv
              python scripts/signed_daily_stamp.py
              git add data/processed/signed_daily_stamps.csv
              if GIT_EDITOR=true git rebase --continue && git push origin HEAD:main; then
                echo "[정보] 스탬프 동일 날짜 충돌 재해결 후 push 성공"
                break
              fi
            fi
            git rebase --abort 2>/dev/null || true
            [ "$i" = 3 ] && { echo "[오류] push 3회 실패"; exit 1; }
            sleep $((i*7))
          done

  # ── WBS 1.1.19: pytest 데이터 품질 테스트 (C-08 검증 후 실행) ────────────────────
  pipeline-tests:
    name: "C-08 | pytest Pipeline Quality Tests (WBS 1.1.19)"
    runs-on: ubuntu-latest
    needs: [c08-dq-validation]
    # A-168/A-169: 암묵 success() 차단(전이 실패 허용) + 수동 취소는 존중(!cancelled())
    if: >-
      !cancelled() &&
      needs.c08-dq-validation.result == 'success' &&
      (needs.c08-dq-validation.outputs.overall_status == 'PASS' ||
       needs.c08-dq-validation.outputs.overall_status == 'WARNING')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest pandas pyarrow numpy statsmodels httpx pyyaml   # httpx: customs_connector import (A-195) · pyyaml: 스키마 파싱 테스트(A-271)
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
          merge-multiple: true
      - name: Run pipeline quality tests
        run: pytest tests/test_pipeline_quality.py -v --tb=short
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_id }}
          path: .pytest_cache/
          retention-days: 14
          if-no-files-found: ignore

  # ── Ralph Loop: 파이프라인 실패 자동 Issue 생성 (수집-실패-이슈-수정-재수집 루프) ──
  # 수집 실패 커넥터 감지 → GitHub Issue 자동 생성 → 담당자 알림 → 수정 PR → 재수집
  # 참조: snarktank/ralph (자가 개선 루프) + nousresearch/hermes-agent (구조적 핸드오프)
  pipeline-failure-loop:
    name: "Ralph Loop | Auto-Issue for Failed Connectors"
    runs-on: ubuntu-latest
    needs: [economic-indicators, shipping-indices, wasde-crop-data, climate-enso,
            geopolitical-risk, production-data, customs-import-stats, commodity-prices,
            c08-dq-validation, c06-eda-validation, pipeline-tests]
    if: |
      always() &&
      (needs.economic-indicators.result == 'failure' ||
       needs.shipping-indices.result == 'failure' ||
       needs.wasde-crop-data.result == 'failure' ||
       needs.climate-enso.result == 'failure' ||
       needs.geopolitical-risk.result == 'failure' ||
       needs.production-data.result == 'failure' ||
       needs.customs-import-stats.result == 'failure' ||
       needs.commodity-prices.result == 'failure')
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Create auto-issue for failed connectors
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'economic-indicators':   '${{ needs.economic-indicators.result }}',
              'shipping-indices':      '${{ needs.shipping-indices.result }}',
              'wasde-crop-data':       '${{ needs.wasde-crop-data.result }}',
              'climate-enso':          '${{ needs.climate-enso.result }}',
              'geopolitical-risk':     '${{ needs.geopolitical-risk.result }}',
              'production-data':       '${{ needs.production-data.result }}',
              'customs-import-stats':  '${{ needs.customs-import-stats.result }}',
              'commodity-prices':      '${{ needs.commodity-prices.result }}',
            };
            const failed = Object.entries(results)
              .filter(([, v]) => v === 'failure')
              .map(([k]) => `- ❌ \`${k}\``).join('\n');
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Pipeline] 커넥터 수집 실패 — ${date}`,
              body: [
                '## 파이프라인 수집 실패 (Ralph Loop 자동 감지)',
                '',
                '### 실패 커넥터',
                failed,
                '',
                `**워크플로우 로그**: ${runUrl}`,
                '',
                '### 진단 체크리스트',
                '- [ ] API 키 GitHub Secrets 등록 여부 확인',
                '- [ ] 엔드포인트 URL 변경 여부 확인 (커넥터 코드 vs MEMORY.md)',
                '- [ ] 응답 형식 변경 여부 확인 (JSON → XML 등)',
                '- [ ] 레이트 리밋 초과 여부 확인 (429 에러)',
                '',
                '### 수정 절차 (Hermes Handoff)',
                '1. 로그 확인 → 오류 원인 분석 (MEMORY.md 참조)',
                '2. 커넥터 코드 수정 → PR 생성',
                '3. `workflow_dispatch` 로 해당 커넥터만 수동 재실행 검증',
                '4. MEMORY.md에 오류 원인·해결책 기록',
                '',
                '**담당**: C-04 파이프라인 엔지니어  **검토**: C-01 PM',
                '**참조**: CLAUDE.md §6 HITL, MEMORY.md',
              ].join('\n'),
              labels: ['pipeline-failure', 'data-collection'],
            });

