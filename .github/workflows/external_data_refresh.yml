name: Data Integration & Reporting Pipeline (수집·실시간 통합 → 리포트)

# 역할(C-01·C-03 협의, Session 36): 확보 데이터(data/raw 히스토리) + 실시간 API 수집분을
#   통합·분석하여 리포트(G1 등)를 생성. Phase 1(핵심변수 식별)·Phase 2 Preview(가격밴드)
#   실전 적용 준비 완료 시까지 **수동 실행(workflow_dispatch)만** 유지 — 조정자 결정.
#   (구 'External Data Pipeline — Daily Refresh'에서 개명·일별 스케줄 제거)
#
# 보안 경계: 내부 ERP 데이터는 이 워크플로우에서 절대 처리하지 않음 (D-021)

on:
  # ⏸️ 일시 중단 (Session 30, 조정자 요청) — 9개년 히스토리 기반 G1 분석의 결과
  #   일관성·적시성 확보를 위해 매일 자동 수집을 일시 정지함.
  #   재개하려면 아래 schedule 블록의 주석을 해제할 것.
  #   ※ GitHub는 기본 브랜치(main) 사본의 schedule만 실행하므로, 실제 중단은
  #     이 변경이 main에 병합된 뒤 적용됨.
  # A-162: 조정자 지시(8/13 — 부재기간 주기 수집)로 일별 스케줄 재개.
  #   Session 30의 일시중단 사유(수집 오류 미해소)는 A-138~A-161로 해소됨.
  schedule:
    # A-263(2026-09-14): 실측 발화 22:08~22:56 UTC(KST 07:08~07:56 — 개장 07:00 후) — GitHub이
    #   정각·30분 슬롯을 혼잡 지연시킨다(INFERENCE). 혼잡 회피 분(19:17 UTC = KST 04:17)으로 이동해
    #   2시간 지연을 감안해도 브리프가 개장 전 착지하게 한다. 호출 횟수(Perplexity 등) 불변.
    #   구: "30 20 * * 0-4" (KST 05:30 설계) — 다음 런 실발화 시각으로 판정.
    - cron: "17 19 * * 0-4"
    # A-223 임시 주말 cron(토·일)은 8/31 게이트 통과(V-004)로 목적 달성 → A-246에서 제거.
  workflow_dispatch:
    # 스케줄 실행: 모든 커넥터 자동 실행 (connector 입력값 무시 — github.event_name == 'schedule' 조건 적용)
    # 수동 실행: connector 선택 가능 (기본값: all). 특정 커넥터만 재실행할 때 사용.
    inputs:
      connector:
        description: "특정 커넥터만 실행 (all / economic / shipping / wasde / climate / gpr / production / commodity / customs / geointel)"
        required: false
        default: "all"

jobs:
  # ── WBS 1.1.2: 경제 지표 (Fed / CPI / FX / WTI / 한국 수입 통계) ────────────
  economic-indicators:
    name: "1.1.2 | Economic Indicators (FRED · BOK ECOS · EIA · KOSIS)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'economic' || github.event_name == 'schedule' }}
    steps:
      # A-136: API 커넥터 잡은 data/raw 원문(GAIN·FAO PDF 등, 추적 파일 1.5GB의 98%)을 읽지 않음
      #   → sparse checkout으로 체크아웃을 수십 MB로 경량화 (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow
      - name: Run economic connector
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python src/pipeline/connectors/economic_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: economic-indicators-${{ github.run_id }}
          path: data/raw/economic_indicators_*.parquet
          retention-days: 7

  # ── WBS 1.1.3: 해운 지수 (BCAA) ──────────────────────────────────────────
  # 대상 지수: BCAA (Baltic Chemical and Agricultural Oil Assessments) — 식물성유지 탱커 전용
  # 제외 사유: BDI(건화물), SCFI/FBX/WCI/HRCI(컨테이너) — 대두유 액체벌크 선박과 무관 (MEMORY A-013)
  # 직접 API: Baltic Exchange/ICE 기업 구독 필요 → 현행 Perplexity 프록시 유지
  # 유료 전환 시: Trading Economics SDK ($65-200/mo, BDI+CPO 포함) 검토 가능 (MEMORY A-012)
  shipping-indices:
    name: "1.1.3 | Shipping Indices (BCAA via Perplexity — 식물성유지 탱커)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'shipping' || github.event_name == 'schedule' }}
    steps:
      # A-136: API 커넥터 잡 — data/raw 원문 불필요, sparse checkout으로 1.5GB → 수십 MB (잡당 1~2분 절감)
      # A-263: 마지막 경로 = BDI xlsx 사본 3순위 폴백. 블록 스칼라 안에는 인라인 주석을 쓰지 말 것(경로에 포함됨 — A-271)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
            data/raw/Trading Economics/Markets/Commodities/Shipping Indices
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # A-132: httpx 누락으로 shipping 잡이 import 단계에서 즉사했다.
        #   shipping_connector는 TE REST(httpx 직접 호출)·stooq 폴백·Perplexity 프록시
        #   모두 httpx를 쓴다. tradingeconomics SDK는 A-034에서 제거됐으므로 정리.
        run: pip install httpx openai pandas pyarrow openpyxl   # openpyxl: TE xlsx 3순위 폴백 읽기(A-271)
      - name: Run shipping connector
        env:
          PERPLEXITY_API_KEY:          ${{ secrets.PERPLEXITY_API_KEY }}
          TRADING_ECONOMICS_API_KEY:   ${{ secrets.TRADING_ECONOMICS_API_KEY }}
        run: python src/pipeline/connectors/shipping_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: shipping-indices-${{ github.run_id }}
          path: data/raw/shipping_indices_*.parquet
          retention-days: 7

  # ── WBS 1.1.4: WASDE / USDA 작황 데이터 ───────────────────────────────────
  wasde-crop-data:
    name: "1.1.4 | WASDE / USDA Crop Data (FAS OpenData · ARMS)"
    runs-on: ubuntu-latest
    timeout-minutes: 30   # A-246: 외부 장애 시 1h30m 공회전 차단(일별은 당해 연도만 호출)
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'wasde' || github.event_name == 'schedule' }}
    steps:
      # A-136: API 커넥터 잡 — data/raw 원문 불필요, sparse checkout으로 1.5GB → 수십 MB (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow
      - name: Run WASDE connector
        env:
          # FAS OpenData API — header 인증 (구: psdonline → 신: OpenData/api/psd)
          USDA_FAS_API_KEY:     ${{ secrets.USDA_FAS_API_KEY }}
          # 구 키 이름 하위 호환 (점진적 전환)
          USDA_FAS_PSD_API_KEY: ${{ secrets.USDA_FAS_PSD_API_KEY }}
          # USDA ARMS 생산비용 데이터
          USDA_ARM_API_KEY:     ${{ secrets.USDA_ARM_API_KEY }}
        run: python src/pipeline/connectors/wasde_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: wasde-crop-${{ github.run_id }}
          path: data/raw/crop_data_*.parquet
          retention-days: 7
          if-no-files-found: error   # A-182: 0건 녹색 통과 차단

  # ── WBS 1.1.5: ENSO / 기상이상 ────────────────────────────────────────────
  climate-enso:
    name: "1.1.5 | Climate & ENSO (NOAA CPC · OpenWeatherMap)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'climate' || github.event_name == 'schedule' }}
    steps:
      # A-136: API 커넥터 잡 — data/raw 원문 불필요, sparse checkout으로 1.5GB → 수십 MB (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow pyyaml   # pyyaml: config/production_regions.yaml 로드(A-261)
      - name: Run climate connector
        env:
          ECMWF_API_KEY: ${{ secrets.ECMWF_API_KEY }}
          # 사용자 키 등록 완료(2026-08-13) — 기상 이상(특보) 수집 활성화
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
        run: python src/pipeline/connectors/climate_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: climate-enso-${{ github.run_id }}
          path: |
            data/raw/climate_data_*.parquet
            data/raw/climate_forecast_*.parquet
          retention-days: 7

  # ── 목표변수 발행: 세션 종가 교차검증 (A-176 — 일별 체인에도 CBOT_BO_CLOSE 공급) ──
  # 일별 파이프라인에는 목표변수 발행 잡이 없어 mart·G1(경보판)이 준비도에서 차단될
  # 구조였다(historical 전용이던 A-145 검증기를 이식). Databento는 repo 커밋 CSV 사용.
  session-close-target:
    name: "목표변수 | CBOT_BO_CLOSE 세션 종가 검증·발행 (A-145 이식)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
            data/raw/Databento
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas pyarrow yfinance curl_cffi openpyxl   # A-182: xlsx 변환 의존성
      - name: Rebuild Databento parquet from committed CSV (A-130)
        run: |
          CSV_PATH=$(find data/raw/Databento/GLBX.MDP3 -name 'ZL_ohlcv-1d_*.csv' -type f | sort | tail -n 1)
          test -n "$CSV_PATH" || { echo "::warning::커밋된 Databento CSV 없음 — 검증 표본 축소"; exit 0; }
          DATABENTO_FROM_CSV="$CSV_PATH" python scripts/ingest_databento_bo.py
      - name: Validate session close (A-145)
        run: |
          set +e
          python scripts/validate_session_close.py
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::warning::세션 종가 검증 불가 — 정산가 표본 미확보 (CBOT_BO_CLOSE 미발행)"
            exit 0
          fi
          exit $rc
      - name: Upload session close artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbot-session-close-daily-${{ github.run_id }}
          path: |
            data/raw/cbot_session_close.parquet
            reports/market/session_close_validation_*.md
          retention-days: 30
          if-no-files-found: warn

  # ── WBS 1.1.6: 지정학 리스크 지수 + AIS 해협 탱커 모니터링 ──────────────────
  # GPR: Caldara & Iacoviello 공개 xlsx (openpyxl 필수) + Perplexity 실시간
  # AIS: AISstream.io 탱커 추적 (무료 tier) → Perplexity 폴백
  geopolitical-risk:
    name: "1.1.6 | GPR + AIS Strait Tanker Monitor (Hormuz·Malacca·Panama)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'gpr' || github.event_name == 'schedule' }}
    steps:
      # A-136: API 커넥터 잡(GPR xlsx는 웹 다운로드·AIS는 실시간) — data/raw 원문 불필요,
      #   sparse checkout으로 1.5GB → 수십 MB (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # openpyxl 필수: pd.read_excel()로 Caldara & Iacoviello GPR xlsx 파싱 (MEMORY A-030)
        # xlrd 필수: GPR 원본이 .xls(구형 포맷) — pd.read_excel 엔진이 xlrd를 요구 (MEMORY A-147)
        run: pip install httpx openai pandas pyarrow openpyxl xlrd
      - name: Run GPR connector
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python src/pipeline/connectors/gpr_connector.py
      - name: Run AIS strait tanker connector
        env:
          AISSTREAM_API_KEY:  ${{ secrets.AISSTREAM_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python src/pipeline/connectors/ais_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: geopolitical-risk-${{ github.run_id }}
          path: |
            data/raw/geopolitical_indices_*.parquet
            data/raw/ais_strait_risk_*.parquet
          retention-days: 7

  # ── WBS 1.1.7: 원산지 생산량·농업기상 + USDA FAS ESR 수출 판매량 ────────────
  # 주의: USDA_FGIS_API_KEY는 이 커넥터와 무관 (FGIS = 원곡 검사, 가공유 미취급, REST API 없음)
  # 대두유 수출 통계: USDA FAS ESR API (apps.fas.usda.gov/OpenData/api/esr) — 인증 불필요
  production-data:
    name: "1.1.7 | Production & Agromet (USDA NASS · FAOSTAT · FAS ESR · NASA POWER · Perplexity)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'production' || github.event_name == 'schedule' }}
    steps:
      # A-136: API 커넥터 잡 — data/raw 원문 불필요, sparse checkout으로 1.5GB → 수십 MB (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx openai pandas pyarrow
      - name: Run production connector
        env:
          # NASS QuickStats — 구 키 이름 유지, USDA_API_KEY로 통합 예정
          USDA_NASS_QUICKSTATS_API_KEY: ${{ secrets.USDA_NASS_QUICKSTATS_API_KEY }}
          # A-161: ESR 403의 원인 — 이 잡 env에 FAS 키가 없어 인증 3방식 전부 무키 시도
          USDA_FAS_API_KEY:     ${{ secrets.USDA_FAS_API_KEY }}
          USDA_FAS_PSD_API_KEY: ${{ secrets.USDA_FAS_PSD_API_KEY }}
          USDA_API_KEY:                 ${{ secrets.USDA_API_KEY }}
          PERPLEXITY_API_KEY:           ${{ secrets.PERPLEXITY_API_KEY }}
        run: python src/pipeline/connectors/production_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: production-data-${{ github.run_id }}
          path: data/raw/production_data_*.parquet
          retention-days: 7

  # ── WBS 1.1.2 보완: 한국 대두유 수입 통계 (관세청 API — MEMORY A-011) ─────────
  # ATFIS_API_KEY: aT FIS = 식품산업통계, HS코드 수입통계 미제공 (MEMORY A-011)
  # 올바른 출처: 공공데이터포털 관세청 API (DATA_GO_KR_SERVICE_KEY) 또는 UN Comtrade Plus
  customs-import-stats:
    name: "1.1.2+ | Korea Customs HS 1507 Import Stats (data.go.kr · UN Comtrade fallback)"
    runs-on: ubuntu-latest
    permissions:
      contents: write   # A-255: _API.xlsx 커밋
    timeout-minutes: 45   # A-223: 예산(1800s)+여유 — 6h 러너 소진 재발 방지
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'customs' || github.event_name == 'schedule' }}
    steps:
      # A-136: API 커넥터 잡 — data/raw 원문 불필요, sparse checkout으로 1.5GB → 수십 MB (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
            data/raw/관세청
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow comtradeapicall openpyxl   # openpyxl: 업로드본 커버리지 판독(A-253)
      - name: Run customs API month increment (A-255 — 업로드본 이후 월만 → {국가}_API.xlsx)
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          CUSTOMS_TIME_BUDGET_S: "1800"
        run: python scripts/customs_gw_api_increment.py
      - name: Commit API companion files (A-184 패턴 — 업로드 원본 불변, `_API.xlsx`만)
        run: |
          git config user.name "nexus-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "data/raw/관세청/**/*_API.xlsx" 2>/dev/null || true
          if git diff --cached --quiet; then echo "API 동반 파일 무변경 — 커밋 생략"; exit 0; fi
          git commit -m "data: 관세청 API 월 증분 → _API.xlsx ($(date -u +%F)) [A-255]"
          # A-271: bot push 경합(교차검증·다른 bot 커밋) 3회 재시도 — 실패는 잡 실패로 가시화
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            git rebase --abort 2>/dev/null || true
            [ "$i" = 3 ] && { echo "[오류] push 3회 실패"; exit 1; }
            sleep $((i*7))
          done
      - name: Run customs connector (백필 전용 — 일별 증분은 위 스텝, A-255)
        if: ${{ env.BACKFILL_MODE == 'true' }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          UN_COMTRADE_API_KEY:    ${{ secrets.UN_COMTRADE_API_KEY }}
          CUSTOMS_TIME_BUDGET_S: "1800"
        run: python src/pipeline/connectors/customs_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: customs-import-${{ github.run_id }}
          path: data/raw/customs_import_*.parquet
          retention-days: 7
          if-no-files-found: ignore   # 증분 모드는 parquet 미생성

  # ── WBS 1.1.33: 지정학 인텔리전스 (Shadowbroker 패턴, Docker 불필요) ────────────
  # USGS 지진: earthquake.usgs.gov (SBO 공급망 핵심 6개 지역 반경 내 M2.5+)
  # NOAA 기상경보: api.weather.gov (미국 중서부 대두 생산 주 Moderate+)
  # GDELT 이벤트: api.gdeltproject.org (대두유 무역·관세·정책 관련 이벤트)
  # NASA FIRMS: firms.modaps.eosdis.nasa.gov (NASA_FIRMS_MAP_KEY 선택적)
  # BACKFILL_MODE=true 시 건너뜀 (실시간 전용)
  geointel:
    name: "1.1.33 | GeoIntel — USGS Seismic · NOAA Weather · GDELT · NASA FIRMS"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.connector == 'all' || github.event.inputs.connector == 'geointel' || github.event_name == 'schedule' }}
    steps:
      # A-136: API 커넥터 잡(실시간 전용) — data/raw 원문 불필요, sparse checkout으로 1.5GB → 수십 MB (잡당 1~2분 절감)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/schemas
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pandas pyarrow
      - name: Run GeoIntel connector
        env:
          NASA_FIRMS_MAP_KEY: ${{ secrets.NASA_FIRMS_MAP_KEY }}
        run: python src/pipeline/connectors/geointel_connector.py
      - name: Upload raw output
        uses: actions/upload-artifact@v4
        with:
          name: geointel-${{ github.run_id }}
          path: data/raw/geointel_*.parquet
          retention-days: 7

  # ── WBS 1.4.1: GPR × SBO 상관관계 분석 (일별 갱신) ────────────────────────────
  # ── 일별 비정형 신호 다이제스트 (A-163 · 조정자 지시 8/14) ────────────────────
  # Perplexity 실시간 프록시(지정학·정책뉴스·해협·운임·기상특보)를 매일 요약.
  # 산출: Step Summary(즉시 열람) + 아티팩트 md (커밋하지 않음 — E4 원칙)
  daily-unstructured-digest:
    name: "일별 비정형 다이제스트 (Perplexity 수집분 요약)"
    runs-on: ubuntu-latest
    needs: [geopolitical-risk, geointel, shipping-indices, climate-enso]
    if: always() && (github.event_name == 'schedule' || github.event.inputs.connector == 'all')
    # A-181: 변수별 일별 아카이브 CSV를 main에 커밋 — A-090(비정형 인덱스 커밋) 선례
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            data/processed
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # openai: 기사별 한국어 헤드라인(A-284) · scrapling·pyyaml: 게이트 통과 기사 본문 코퍼스(A-292)
        run: pip install pandas pyarrow httpx openai pyyaml "scrapling[fetchers]==0.5"
      - uses: actions/download-artifact@v4
        with:
          path: data/raw/
          merge-multiple: true
      - name: Build daily digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # A-284: 한국어 헤드라인 모델·추론 강도 — 승인자 지시(독해·번역 정확도 최고 모델). 모델 ID 변경 시 Variables로 교정.
          BRIEF_LLM_MODEL: ${{ vars.BRIEF_LLM_MODEL || 'gpt-5.6-luna' }}
          BRIEF_LLM_EFFORT: ${{ vars.BRIEF_LLM_EFFORT || 'xhigh' }}
          KO_HEADLINE_DAILY_CAP: ${{ vars.KO_HEADLINE_DAILY_CAP || '60' }}
          # A-292: 본문 크롤링 on/off·일 상한 — Variables로 끌 수 있다(0이면 미수집)
          CRAWL_FULLTEXT: ${{ vars.CRAWL_FULLTEXT || '1' }}
          CRAWL_DAILY_CAP: ${{ vars.CRAWL_DAILY_CAP || '40' }}
        run: python scripts/daily_unstructured_digest.py >> "$GITHUB_STEP_SUMMARY"
      - name: Commit daily signal archive (A-181 — 변수별 영구 축적)
        run: |
          if git diff --quiet -- data/processed/unstructured_daily_signals.csv data/processed/ko_headline_cache.json data/processed/crawl_corpus 2>/dev/null \
             && git ls-files --error-unmatch data/processed/unstructured_daily_signals.csv >/dev/null 2>&1 \
             && [ -z "$(git ls-files --others --exclude-standard data/processed/ko_headline_cache.json data/processed/crawl_corpus)" ]; then
            echo "아카이브 무변경 — 커밋 생략"
            exit 0
          fi
          git config user.name "nexus-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed/unstructured_daily_signals.csv "data/semantic/events" 2>/dev/null || git add data/processed/unstructured_daily_signals.csv
          git add data/processed/ko_headline_cache.json 2>/dev/null || true   # A-284: 한국어 헤드라인 캐시(기사당 1회 호출 보장)
          git add data/processed/crawl_corpus 2>/dev/null || true             # A-292: 기사 본문 코퍼스(월별 JSONL)
          git commit -m "data: 일별 비정형 신호 아카이브 append ($(date -u +%F)) [A-181]" || exit 0
          # A-271: bot push 경합(교차검증·다른 bot 커밋) 3회 재시도 — 실패는 잡 실패로 가시화
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            git rebase --abort 2>/dev/null || true
            [ "$i" = 3 ] && { echo "[오류] push 3회 실패"; exit 1; }
            sleep $((i*7))
          done
      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-unstructured-digest-${{ github.run_id }}
          path: |
            reports/market/daily_unstructured_digest_*.md
            data/processed/unstructured_daily_signals.csv
          retention-days: 90
          if-no-files-found: warn

