  # ── v3.2 추가: 해상 병목 위협도(규칙 기반 파생 — 확률 아님) ───────────
  - indicator: MARITIME_THREAT_HORMUZ
    defined_in: data/schemas/
    entities: [TERM-081]
    causal_edges: [CE-013]
    scale: 0-100 참고 지수
    note: 규칙 기반 파생 — 확률 아님. 사건 발생 가능성으로 읽지 않는다.
  - indicator: MARITIME_THREAT_SUEZ
    defined_in: data/schemas/
    entities: [TERM-168, TERM-169]
    causal_edges: [CE-013]
    scale: 0-100 참고 지수
    note: 규칙 기반 파생 — 확률 아님. 수에즈·바브엘만데브는 한 회랑이므로 이중 계상 금지.
  - indicator: MARITIME_THREAT_MALACCA
    defined_in: data/schemas/
    entities: [TERM-167]
    causal_edges: [CE-013]
    scale: 0-100 참고 지수
    note: 규칙 기반 파생 — 확률 아님. 우회 가능 구간이라 차단이 아닌 지연·비용 신호로 해석한다.
  - indicator: MARITIME_THREAT_PANAMA
    defined_in: data/schemas/
    entities: [TERM-083]
    causal_edges: [CE-013]
    scale: 0-100 참고 지수
    note: 규칙 기반 파생 — 확률 아님.
  - indicator: MARITIME_THREAT_BLACKSEA
    defined_in: data/schemas/
    entities: [TERM-170, TERM-082]
    causal_edges: [CE-013]
    scale: 0-100 참고 지수
    note: 규칙 기반 파생 — 확률 아님. 해바라기유 경로 관측용이며 대두유 가격 서술에 쓰지 않는다(CE-014 candidate).
  - indicator: MARITIME_THREAT_INDEX
    defined_in: data/schemas/
    entities: [TERM-081, TERM-083, TERM-167, TERM-168, TERM-169, TERM-170]
    causal_edges: [CE-013]
    scale: 0-100 참고 지수
    note: 지점별 위협도의 규칙 기반 종합 — 확률 아님. 회랑 단위 1회 계상 후 종합한다.
  # v3.2 신설 — 접미·접두가 붙는 템플릿 지표 계열(개별 열거 불가).
  # 커넥터가 지역·품목·속성 축을 코드 접미로 붙여 발행하는 계열이다. 개별 코드를 전부 열거하지
  # 않고 패턴으로 계약한다. 축 분리가 무너지면 값 충돌이 발생하므로(키 붕괴) 접미는 필수다.
  structured_patterns:
  - pattern: AIS_{STRAIT}_TANKER_COUNT
    regex: '^AIS_[A-Z_]+_TANKER_COUNT$'
    entities: [TERM-081, TERM-083, TERM-167, TERM-168, TERM-169]
    note: 해협별 탱커 통과 척수. 척수는 위험 신호이지 화물·물량이 아니다.
  - pattern: AIS_{STRAIT}_RISK
    regex: '^AIS_[A-Z_]+_RISK$'
    entities: [TERM-081, TERM-083, TERM-167, TERM-168, TERM-169]
    note: 해협별 규칙 기반 위험도(0-100 참고 지수) — 확률 아님.
  - pattern: DROUGHT_{level}_{state}
    regex: '^DROUGHT_D[0-4]_[A-Z]{2}$'
    entities: [TERM-024, TERM-027]
    note: 미국 가뭄 모니터 단계(D0~D4)×주. 단계는 순서형이며 합산하지 않는다.
  - pattern: CROP_CONDITION_{region}
    regex: '^CROP_CONDITION_[A-Z0-9_]+$'
    entities: [TERM-032, TERM-040]
    note: 지역별 작황 상태 — 지역 간 단순 평균은 재배면적 가중 없이는 금지.
  # v3.3 — 구 정규식(T2M|PRECTOTCORR|…)_[A-Z]{2}은 실제 발행 코드와 하나도 맞지 않았다(빈 계약).
  #   실코드 두 계열로 분리하고 예보 계열(FCST_)을 추가한다. 지역 접미의 단일 원천은 production_regions.
  - pattern: '{var}_{region}'                # NASA POWER 업로드본 — 접미 {Region}
    regex: '^(T2M|T2M_MAX|T2M_MIN|PRECTOTCORR|RH2M|ALLSKY_SFC_SW_DWN|ALLSKY_SFC_PAR_TOT|GWETROOT|GWETTOP)_[A-Za-z_]+$'
    entities: [TERM-019, TERM-024]
    note: NASA POWER 기후 변수×생산지역(업로드본 형식). 지역 접미가 없으면 값 충돌이 발생한다.
  - pattern: '{openmeteo_var}_{CC}_{Region}'  # Open-Meteo ERA5-Land 실측 — 접미 {CC}_{Region}
    regex: '^(temperature_2m_max|temperature_2m_min|precipitation_sum|shortwave_radiation_sum|soil_temperature_0_to_7cm|soil_moisture_0_to_7cm|et0_fao_evapotranspiration|sunshine_duration)_[A-Z]{2}_[A-Za-z]+$'
    entities: [TERM-019, TERM-024]
    note: Open-Meteo 기후 변수×국가코드×생산지역(production_regions tier 1·2). 토양 변수는 hourly 일평균 집계본이다.
  - pattern: 'FCST_{var}_{CC}_{Region}'      # v3.3 신설 — Open-Meteo 예보 계열
    regex: '^FCST_(temperature_2m_max|temperature_2m_min|precipitation_sum|shortwave_radiation_sum|et0_fao_evapotranspiration)_[A-Z]{2}_[A-Za-z]+$'
    entities: [TERM-019, TERM-024]
    note: 기상 예보는 참고 지표다 — 실측 대비 검증(예보 오차 분포) 전에는 모델 투입 금지. 예보와 실측을 같은 코드로 합치지 않는다. 2026-09-14(A-263)부터 별도 데이터셋 climate_forecast(price_date=발행일·valid_date=유효일·lead_days) — 관측 파케이·마트 미포함.
  - pattern: PSD_{attr}
    regex: '^PSD_[A-Z_]+$'
    entities: [TERM-033, TERM-035, TERM-036]
    note: USDA PS&D 속성별 수급. 세계 표와 국가 표를 같은 코드로 합치지 않는다.
  - pattern: SBO_{attr}_{cc}
    regex: '^SBO_[A-Z_]+_[A-Z]{2,3}$'
    entities: [TERM-042, TERM-036]
    note: 대두유 속성×국가코드. 국가 접미 없이 발행하면 65개국이 한 코드로 충돌한다.
  unstructured_derived:             # UNSTR_* 코퍼스 신호 시계열 (감사 갭 4 — 임시 등록)
    pattern: "UNSTR_{GAIN|FAO}_{한글태그}"
    source_script: scripts/build_unstructured_timeseries.py
    unit_doc_count: 월별 태그 문서 수 (무차원)
    unit_tone: (bull-bear)/(bull+bear) ∈ [-1, 1]
    note: metrics.yaml INDICATOR_DEFINITION 정식 이관과 한글 접미사 영문화는 잔여 갭 —
      이관 전까지 본 레지스트리가 존재 계약을 담당
    codes:
    - UNSTR_GAIN_수출규제
    - UNSTR_GAIN_수입관세
    - UNSTR_GAIN_바이오연료수요
    - UNSTR_GAIN_기상이변
    - UNSTR_GAIN_압착
    - UNSTR_GAIN_재고
    - UNSTR_GAIN_생산변동
    - UNSTR_GAIN_물류충격
    - UNSTR_GAIN_TONE
    - UNSTR_FAO_수출규제
    - UNSTR_FAO_수입관세
    - UNSTR_FAO_바이오연료수요
    - UNSTR_FAO_기상이변
    - UNSTR_FAO_압착
    - UNSTR_FAO_재고
    - UNSTR_FAO_생산변동
    - UNSTR_FAO_물류충격
    - UNSTR_FAO_TONE

# ── 신호 태그 공식 매핑 (감사 갭 3 — 태그 3원화 해소) ────────────────────────
signal_tag_mapping:
  note: 한글 신호 태그(코퍼스 스크립트) ↔ UNSTR_* 시계열 ↔ P1-05 aspect 지표의 단일 기준.
